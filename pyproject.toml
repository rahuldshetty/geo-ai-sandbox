[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-ai"
version = "0.0.1"
description = "Geospatial-analysis agent in a custom web UI"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv",
  "pydantic-ai[openai,anthropic,google-gla]",
  "pydantic-ai-harness>=0.24.0",
  "rasterio",
  "rioxarray",
  "geopandas",
  "pyogrio",
  "shapely",
  "pyproj",
  "numpy",
  "pandas",
  "fastapi",
  "uvicorn",
  "python-multipart",
  "geolibre==2.9.0",
]

[project.optional-dependencies]
gdal = ["gdal"]

[project.scripts]
geo-ai = "geoai.server:run"

[tool.setuptools.packages.find]
include = ["geoai*"]

[tool.setuptools.package-data]
geoai = ["server/static/*", "server/static/vendor/*"]
